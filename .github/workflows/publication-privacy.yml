name: Publication privacy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  publication-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check tracked publication files
        run: python -B code/check_publication_privacy.py --tracked
      - name: Scan current files and incoming commits for credentials
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          scanner_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$scanner_dir/default.toml"
          touch "$scanner_dir/no-ignores"
          mkdir "$scanner_dir/current"
          git archive HEAD | tar -x -C "$scanner_dir/current"
          scanner=("$scanner_dir/gitleaks" --config "$scanner_dir/default.toml" \
            --gitleaks-ignore-path "$scanner_dir/no-ignores" --ignore-gitleaks-allow \
            --redact=100 --no-banner --no-color)
          "${scanner[@]}" dir "$scanner_dir/current"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ && "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
            "${scanner[@]}" git . --log-opts="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ && "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            "${scanner[@]}" git . --log-opts="$BEFORE_SHA..$GITHUB_SHA"
          else
            # New branch pushes have no before SHA. Scan their complete new
            # history, including credentials removed again before the tip.
            [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
            default_ref="refs/remotes/origin/$DEFAULT_BRANCH"
            if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]] && \
               base_sha="$(git merge-base "$GITHUB_SHA" "$default_ref")"; then
              [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
              "${scanner[@]}" git . --log-opts="$base_sha..$GITHUB_SHA"
            else
              # No shared default-branch history: scan all reachable commits.
              "${scanner[@]}" git . --log-opts="$GITHUB_SHA"
            fi
          fi
