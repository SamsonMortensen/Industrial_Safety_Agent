name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.14'
          - os: ubuntu-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install only the showcase dependencies
        run: python -m pip install -r requirements-showcase.txt
      - name: Run the visitor walkthrough without a model
        run: python -B code/showcase.py --benchmark-cases 64 --out benchmark_runs/showcase/ci_showcase.json
      - name: Check showcase safety and output contracts
        run: python -B -m unittest discover -s tests -p test_showcase.py -v
      - name: Install the full analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Compile the code
        run: python -m compileall -q code tests
      - name: Run public regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify saved evaluation without model weights
        run: python code/validate_saved_evaluation.py
      - name: Verify public analytics and result provenance
        run: python code/public_results.py --check
      - name: Reproduce the lexical retrieval comparison
        run: python code/capture_retrieval_run.py --out benchmark_runs/retrieval_ci.json
      - name: Verify matched retrieval evidence
        run: python code/report_retrieval_comparison.py --check --candidate-capture benchmark_runs/retrieval_ci.json
      - name: Execute the beginner notebook without model requests
        run: python code/validate_notebook.py
      - name: Record the tested revision and environment
        if: always()
        env:
          CI_CHECK_STATUS: ${{ job.status }}
        run: >-
          python -c "import json, os, platform; from pathlib import Path;
          folder = Path('benchmark_runs'); folder.mkdir(exist_ok=True);
          (folder / 'ci_environment.json').write_text(json.dumps({
          'commit': os.environ['GITHUB_SHA'], 'runner_os': os.environ['RUNNER_OS'],
          'python': platform.python_version(),
          'checks_status': os.environ['CI_CHECK_STATUS']}, indent=2), encoding='utf-8')"
      - name: Check evidence before upload
        id: publication_privacy
        if: always()
        run: python -B code/check_publication_privacy.py --ci-artifacts
      - name: Preserve public development evidence
        if: always() && steps.publication_privacy.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-development-evidence-${{ matrix.os }}-py${{ matrix.python }}
          retention-days: 30
          if-no-files-found: error
          path: |
            benchmark_runs/ci_environment.json
            benchmark_runs/showcase/ci_showcase.json
            benchmark_runs/retrieval_ci.json
            docs/RETRIEVAL_IMPROVEMENT.md
            docs/RESULTS.md
            docs/results/audit_tradeoffs.png
            docs/results/calibration_diagnostics.png
            docs/results/person_development.png
            docs/results/original_nine_misses.png
            docs/results/retrieval_before_after.png
            docs/results/retrieval_rank_cutoffs.png
            docs/results/group_split_before_after.png
            docs/results/manifest.json
            docs/results/metrics.json
            docs/results/retrieval_comparison.json
            docs/results/retrieval_manifest.json
            docs/results/group_split_before_after.json
            docs/results/retrieval_cases.csv
            data/retrieval_comparison/after.json
            data/retrieval_comparison/before.json
            data/retrieval_comparison/candidate_freeze.json
            data/retrieval_comparison/exploration.json
            data/retrieval_comparison/protocol.json
